name: setup
description: Install the pinned Vite+ toolchain and workspace dependencies from the frozen lockfile.
inputs:
  working-directory:
    description: Repository checkout directory, relative to the workspace.
    required: false
    default: "."
  toolchain:
    description: Also install nargo, bb and Foundry (hash-verified, see .github/scripts/install-toolchain.sh).
    required: false
    default: "false"
# repro-build.yml inlines these steps (a matrix path cannot be used in `uses:`); keep them in sync.
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        version-file: pnpm-workspace.yaml
        node-version-file: .node-version
        working-directory: ${{ inputs.working-directory }}
        run-install: "false"
        cache: "true"
    # --ignore-scripts on top of strictDepBuilds: enabling any install script
    # needs this file changed, i.e. the owner's review. --ignore-pnpmfile:
    # pnpmfile hooks run code at install time whatever --ignore-scripts says.
    - name: Install dependencies (frozen lockfile, no install scripts)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: vp install --frozen-lockfile --ignore-scripts -- --ignore-pnpmfile
    - name: Install Noir, Barretenberg and Foundry
      if: inputs.toolchain == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: .github/scripts/install-toolchain.sh "$RUNNER_TEMP/abolish-toolchain/bin"
