packages:
  - apps/*
  - packages/*
  # CI gate code lives under .github/ so CODEOWNERS covers it: a PR cannot
  # weaken the policy that checks it without the owner's review.
  - .github/tools/*

# Supply chain (see AGENTS.md "Dependencies"): every version is exact and lives
# here once. Packages reference it with "catalog:".
catalogMode: strict
savePrefix: ""

# Refuse versions younger than 7 days (minutes); most malicious publishes are
# caught and yanked well inside that window.
minimumReleaseAge: 10080
# Refuse git/tarball/URL dependencies anywhere in the tree.
blockExoticSubdeps: true
# Refuse a version whose publish provenance is weaker than an earlier one.
trustPolicy: no-downgrade
# semver@6.3.1 is a July 2023 security backport published without provenance
# after 7.5.x had it, so no-downgrade flags it falsely. Storybook needs it via
# react-docgen -> @babel/core 7. Owner decision 2026-10-11 (P0-2).
trustPolicyExclude:
  - semver@6.3.1
# Install scripts run only for packages listed in allowBuilds.
strictDepBuilds: true
allowBuilds: {}
# msgpackr (via bullmq, P2-4) loads this optional native accelerator, a
# prebuilt binary, whenever it is installed. Left out, msgpackr uses its
# pure-JS codec, and no opaque native code runs beside the database
# credential. apps/worker's tests check it doesn't resolve.
ignoredOptionalDependencies:
  - msgpackr-extract

catalog:
  # Proving toolchain: must match NOIR_VERSION / BB_VERSION in
  # .github/scripts/install-toolchain.sh (AGENTS.md "Toolchain pins").
  "@aztec/bb.js": 5.0.0-nightly.20260522
  "@base-ui/react": 1.8.0
  "@better-auth/passkey": 1.7.7
  "@changesets/cli": 3.0.3
  "@fontsource-variable/jetbrains-mono": 5.3.0
  "@fontsource-variable/oxanium": 5.3.0
  # Static fonts for apps/web's link previews: satori reads TTF, OTF and WOFF,
  # and the variable packages ship only WOFF2.
  "@fontsource/jetbrains-mono": 5.3.0
  "@fontsource/oxanium": 5.3.0
  "@noble/ciphers": 2.4.0
  "@noble/curves": 2.4.0
  "@noble/hashes": 2.4.0
  "@noble/post-quantum": 0.7.1
  "@noir-lang/noir_js": 1.0.0-beta.22
  "@orpc/client": 1.15.4
  "@orpc/contract": 1.15.4
  "@orpc/openapi": 1.15.4
  "@orpc/openapi-client": 1.15.4
  "@orpc/server": 1.15.4
  "@orpc/zod": 1.15.4
  # apps/web's link previews: SVG to PNG in WebAssembly, no native binary.
  "@resvg/resvg-wasm": 2.6.2
  "@shadcn/react": 0.3.1
  "@storybook/addon-a11y": 10.6.1
  "@storybook/addon-vitest": 10.6.1
  "@storybook/react-vite": 10.6.1
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-router": 1.170.41
  "@tanstack/react-start": 1.168.60
  "@types/node": 24.19.1
  "@types/react": 19.2.7
  "@types/react-dom": 19.2.3
  "@vitest/browser-playwright": 5.0.1
  "@wagmi/cli": 2.10.0
  # apps/web's accessibility audit (tests/a11y.e2e.ts): the rules engine the
  # Storybook a11y addon already runs, at the version it resolves.
  axe-core: 4.13.0
  better-auth: 1.7.7
  bullmq: 6.3.11
  class-variance-authority: 0.7.1
  cmdk: 1.1.1
  cn: 0.4.0
  date-fns: 4.4.0
  drizzle-orm: 0.45.3
  embla-carousel-react: 8.6.0
  esbuild: 0.28.2
  fast-check: 4.10.2
  # The ballot client's membership prover (packages/membership-prover; ADR
  # 0009, Amendment 2026-10-17): snarkjs's own ffjavascript, pinned beside it.
  ffjavascript: 0.3.1
  hono: 4.13.13
  input-otp: 1.5.0
  ioredis: 5.11.1
  lucide-react: 1.52.0
  playwright: 1.63.0
  ponder: 0.18.0
  postgres: 3.4.9
  react: 19.3.0
  react-day-picker: 10.0.2
  react-dom: 19.3.0
  react-resizable-panels: 4.14.2
  # apps/web's link previews: card layout and text to SVG paths. 0.26.0, the
  # last release before harfbuzzjs joined its dependencies.
  satori: 0.26.0
  recharts: 3.8.0
  # Only for the recharts>reselect override below.
  reselect: 5.3.0
  shadcn: 4.21.1
  snarkjs: 0.7.5
  storybook: 10.6.1
  tailwindcss: 4.3.3
  tw-animate-css: 1.4.0
  typescript: 7.0.2
  viem: 2.57.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
  yaml: 2.9.1
  zod: 4.6.5

overrides:
  vite@*: "catalog:"
  # recharts pins reselect 5.1.1 exactly, which was published with weaker
  # provenance than the 5.0.x line (trustPolicy flags it). 5.3.0 is the same
  # major, already in the tree via Base UI, and has provenance; the catalog
  # pins it, since CI accepts only catalog-resolved overrides.
  recharts>reselect: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
