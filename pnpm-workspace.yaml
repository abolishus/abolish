packages:
  - apps/*
  - packages/*
  # CI gate code lives under .github/ so CODEOWNERS covers it: a PR cannot
  # weaken the policy that checks it without the owner's review.
  - .github/tools/*

# Supply chain (see AGENTS.md "Dependencies"): every version is exact and lives
# here once. Packages reference it with "catalog:".
catalogMode: strict
savePrefix: ""

# Refuse versions younger than 7 days (minutes); most malicious publishes are
# caught and yanked well inside that window.
minimumReleaseAge: 10080
# Refuse git/tarball/URL dependencies anywhere in the tree.
blockExoticSubdeps: true
# Refuse a version whose publish provenance is weaker than an earlier one.
trustPolicy: no-downgrade
# semver@6.3.1 is a July 2023 security backport published without provenance
# after 7.5.x had it, so no-downgrade flags it falsely. Storybook needs it via
# react-docgen -> @babel/core 7. Owner decision 2026-10-11 (P0-2).
trustPolicyExclude:
  - semver@6.3.1
# Install scripts run only for packages listed in allowBuilds.
strictDepBuilds: true
allowBuilds: {}

catalog:
  # Proving toolchain: must match NOIR_VERSION / BB_VERSION in
  # .github/scripts/install-toolchain.sh (AGENTS.md "Toolchain pins").
  "@aztec/bb.js": 5.0.0-nightly.20260522
  "@changesets/cli": 3.0.3
  "@noble/curves": 2.4.0
  "@noble/hashes": 2.4.0
  "@noir-lang/noir_js": 1.0.0-beta.22
  "@types/node": 24.19.1
  fast-check: 4.10.2
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  yaml: 2.9.1

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
