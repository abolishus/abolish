# Builds, signs and deploys the API, web, ballot, worker and trustee-node
# images to staging on every push to main (P2-11; docs/runbooks/railway.md).
# Threats: T-61 (release compromise), T-65 (deployer credential leak), T-56
# (compromised action or runner), T-23.
#
#   image-<service>-a/b  one fresh checkout each, different path, locale,
#              timezone and umask; build the bundle and the image (.github/
#              actions/image-build); output the image manifest digest. No
#              secrets. One pair per service (api, web, ballot, worker,
#              trustee-node).
#   checks     ci, repro-build and reference-election passed on this commit.
#   publish    per service: both digests match; the archive is that image;
#              push it to GHCR by digest, sign it (cosign keyless) and attest SLSA build
#              provenance. No Railway token.
#   staging    in the `staging` environment (main only): verify signature and
#              provenance of every image, run the API image's migrations,
#              then point the Railway `api`, `web` and `ballot` services at
#              their digests, in that order, then the workers and the
#              launch panel's seats once their service IDs are set, and
#              wait for each deployment.
#
# Production is not here yet: its deploy needs the reference election to have
# passed against staging for the digest (P1-20), so until then no job can
# deploy to production at all. Railway never builds: it pulls the digest.
name: deploy

on:
  push:
    branches: [main]

permissions: {}

# One staging deploy at a time, in push order; a newer push supersedes a
# queued one, never a running one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  DO_NOT_TRACK: "1"

jobs:
  image-api-a:
    name: image api (a)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: build
        uses: ./.github/actions/image-build
        with:
          service: api
          variant: a

  image-api-b:
    name: image api (b)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: build
        uses: ./.github/actions/image-build
        with:
          service: api
          variant: b

  image-web-a:
    name: image web (a)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: build
        uses: ./.github/actions/image-build
        with:
          service: web
          variant: a

  image-web-b:
    name: image web (b)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: build
        uses: ./.github/actions/image-build
        with:
          service: web
          variant: b

  image-ballot-a:
    name: image ballot (a)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: build
        uses: ./.github/actions/image-build
        with:
          service: ballot
          variant: a

  image-ballot-b:
    name: image ballot (b)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: build
        uses: ./.github/actions/image-build
        with:
          service: ballot
          variant: b

  image-worker-a:
    name: image worker (a)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: build
        uses: ./.github/actions/image-build
        with:
          service: worker
          variant: a

  image-worker-b:
    name: image worker (b)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: build
        uses: ./.github/actions/image-build
        with:
          service: worker
          variant: b

  image-trustee-node-a:
    name: image trustee-node (a)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: build
        uses: ./.github/actions/image-build
        with:
          service: trustee-node
          variant: a

  image-trustee-node-b:
    name: image trustee-node (b)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: build
        uses: ./.github/actions/image-build
        with:
          service: trustee-node
          variant: b

  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      checks: read
    steps:
      # As in release.yml: only check runs created by GitHub Actions (app
      # 15368) count, and on a commit of main only push-triggered runs exist.
      - name: ci, repro-build and reference-election passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 160); do
            pending=0
            for check in ci repro-build reference-election; do
              for attempt in 1 2 3; do
                if run="$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=$check&filter=latest" \
                  --jq '[.check_runs[] | select(.app.id == 15368)] | max_by(.id) // {} | "\(.status // "missing") \(.conclusion // "")"')"; then
                  break
                fi
                [ "$attempt" = 3 ] && exit 1
                sleep 10
              done
              case "$run" in
                "completed success") ;;
                "completed "*)
                  echo "::error::$check concluded ${run#completed } on $SHA; not deploying"
                  exit 1
                  ;;
                *) pending=1 ;;
              esac
            done
            if [ "$pending" = 0 ]; then
              echo "ci, repro-build and reference-election passed on $SHA"
              exit 0
            fi
            sleep 30
          done
          echo "::error::checks still pending on $SHA after 80 minutes"
          exit 1

  publish:
    name: publish ${{ matrix.service }}
    needs:
      - image-api-a
      - image-api-b
      - image-web-a
      - image-web-b
      - image-ballot-a
      - image-ballot-b
      - image-worker-a
      - image-worker-b
      - image-trustee-node-a
      - image-trustee-node-b
      - checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        service: [api, web, ballot, worker, trustee-node]
    env:
      SERVICE: ${{ matrix.service }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/abolish-${{ matrix.service }}
      # Job outputs, never artifacts, carry the digests (see below). Each
      # service names its own pair and anything else is empty, so a missing
      # output fails the check below instead of falling through to another
      # service's digest.
      DIGEST: ${{ matrix.service == 'api' && needs.image-api-a.outputs.digest || matrix.service == 'web' && needs.image-web-a.outputs.digest || matrix.service == 'ballot' && needs.image-ballot-a.outputs.digest || matrix.service == 'worker' && needs.image-worker-a.outputs.digest || matrix.service == 'trustee-node' && needs.image-trustee-node-a.outputs.digest || '' }}
      DIGEST_B: ${{ matrix.service == 'api' && needs.image-api-b.outputs.digest || matrix.service == 'web' && needs.image-web-b.outputs.digest || matrix.service == 'ballot' && needs.image-ballot-b.outputs.digest || matrix.service == 'worker' && needs.image-worker-b.outputs.digest || matrix.service == 'trustee-node' && needs.image-trustee-node-b.outputs.digest || '' }}
    steps:
      - name: Both builds produced one image
        env:
          A: ${{ env.DIGEST }}
          B: ${{ env.DIGEST_B }}
        run: |
          [[ "$A" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from build a"; exit 1; }
          if [ "$A" != "$B" ]; then
            echo "::error::image digests differ between builds ($A, $B); the image is not reproducible"
            exit 1
          fi
          echo "image digest: $A" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-a-${{ matrix.service }}
          path: ${{ runner.temp }}/image
      # The artifact can be replaced by anything else in the run; the digest
      # is a job output, which can't. Only the image it names is pushed.
      - name: The archive is that image
        run: |
          actual="sha256:$(skopeo inspect --raw "oci-archive:$RUNNER_TEMP/image/$SERVICE.tar" | sha256sum | cut -d' ' -f1)"
          if [ "$actual" != "$DIGEST" ]; then
            echo "::error::archive holds $actual, built $DIGEST"
            exit 1
          fi
      - name: Push by digest
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          # skopeo and cosign both read the Docker credentials this writes.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          # --preserve-digests: fail rather than push a recompressed image
          # under another digest. The tag is for people; deploys use digests.
          skopeo copy --preserve-digests "oci-archive:$RUNNER_TEMP/image/$SERVICE.tar" "docker://$IMAGE:sha-$SHA"
          pushed="$(skopeo inspect --raw "docker://$IMAGE@$DIGEST" | sha256sum | cut -d' ' -f1)"
          [ "sha256:$pushed" = "$DIGEST" ]
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Cosign keyless signature
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

  # Runs deploy one at a time in push order (concurrency, above), so a first
  # attempt deploys its own commit even when main has moved on: the newer
  # commit's run is queued behind this one and deploys after it. Skipping
  # instead starved staging whenever merges came faster than a run takes.
  # A re-run is different: it could point staging back at an older digest
  # with nobody meaning to roll back, so a re-run deploys only main's head.
  current:
    name: may deploy
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.head.outputs.deploy }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$head" = "$SHA" ]; then
            echo "deploy=true" >>"$GITHUB_OUTPUT"
          elif [ "$ATTEMPT" = 1 ]; then
            echo "deploy=true" >>"$GITHUB_OUTPUT"
            echo "::notice::main has moved on to $head; deploying $SHA anyway, and $head's run deploys after it"
          else
            echo "deploy=false" >>"$GITHUB_OUTPUT"
            echo "::notice::a re-run of $SHA, which is no longer main's head ($head); not deploying an older commit"
          fi

  staging:
    name: staging
    needs:
      [
        image-api-a,
        image-web-a,
        image-ballot-a,
        image-worker-a,
        image-trustee-node-a,
        publish,
        current,
      ]
    if: needs.current.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    # Up to thirteen Railway deployments, one after another.
    timeout-minutes: 60
    # Secrets live only in this environment, which allows `main` alone
    # (owner setting): a workflow run for a PR branch can't read them (T-65).
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      # publish checked each against its second build and pushed exactly it.
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/abolish-api@${{ needs.image-api-a.outputs.digest }}
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/abolish-web@${{ needs.image-web-a.outputs.digest }}
      BALLOT_IMAGE: ghcr.io/${{ github.repository_owner }}/abolish-ballot@${{ needs.image-ballot-a.outputs.digest }}
      WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/abolish-worker@${{ needs.image-worker-a.outputs.digest }}
      SEAT_IMAGE: ghcr.io/${{ github.repository_owner }}/abolish-trustee-node@${{ needs.image-trustee-node-a.outputs.digest }}
    steps:
      # The fail-safe for the rule in `current`: a re-run deploys only main's
      # head, since it could otherwise point staging back at an older digest
      # with nobody meaning to roll back; a rollback is a redeploy of an earlier
      # deployment in Railway (docs/runbooks/railway.md).
      - name: A re-run deploys only main's head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$ATTEMPT" != 1 ] && [ "$head" != "$SHA" ]; then
            echo "::error::a re-run of $SHA, which is no longer main's head ($head); not deploying an older commit"
            exit 1
          fi
      # Before anything reads the image: the package may still be private.
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      # Signed by this workflow on main, with provenance from this repository:
      # the digest deployed is the one publish built twice and compared.
      - name: Verify signatures and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
          REPO: ${{ github.repository }}
        run: |
          for image in "$API_IMAGE" "$WEB_IMAGE" "$BALLOT_IMAGE" "$WORKER_IMAGE" "$SEAT_IMAGE"; do
            cosign verify "$image" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            gh attestation verify "oci://$image" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/deploy.yml" --source-ref refs/heads/main
          done
      # The image's own migrate.mjs, as a login granted abolish_migrator
      # that the API service never holds (docs/runbooks/railway.md).
      - name: Migrate
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::MIGRATE_DATABASE_URL is not set in the staging environment"; exit 1; }
          docker run --rm -e DATABASE_URL "$API_IMAGE" node migrate.mjs
      # The API first: the web app's pages and the ballot client call it, and
      # the API, web app and workers run against the migrations just applied.
      # The workers and the seats can't run until staging's testnet contracts
      # and keys exist (docs/runbooks/staging-testnet.md), so each is deployed
      # only once its service ID is set and skipped with a notice until then;
      # their images are built, signed and verified either way.
      - name: Deploy the API, the web app, the ballot client, the workers and the seats to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
          WEB_SERVICE_ID: ${{ vars.RAILWAY_WEB_SERVICE_ID }}
          BALLOT_SERVICE_ID: ${{ vars.RAILWAY_BALLOT_SERVICE_ID }}
          SETUP_WORKER_SERVICE_ID: ${{ vars.RAILWAY_SETUP_WORKER_SERVICE_ID }}
          CREATION_WORKER_SERVICE_ID: ${{ vars.RAILWAY_CREATION_WORKER_SERVICE_ID }}
          POSTING_WORKER_SERVICE_ID: ${{ vars.RAILWAY_POSTING_WORKER_SERVICE_ID }}
          # Space- or comma-separated, seat 1 first.
          SEAT_SERVICE_IDS: ${{ vars.RAILWAY_SEAT_SERVICE_IDS }}
          # Railway's GraphQL API (backboard.railway.com/graphql/v2).
          Q_ENV: "query { projectToken { environmentId } }"
          Q_SOURCE: >-
            mutation($s: String!, $e: String!, $i: String!) {
            serviceInstanceUpdate(serviceId: $s, environmentId: $e, input: { source: { image: $i } }) }
          Q_DEPLOY: "mutation($s: String!, $e: String!) { serviceInstanceDeployV2(serviceId: $s, environmentId: $e) }"
          Q_STATUS: "query($d: String!) { deployment(id: $d) { status } }"
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$API_SERVICE_ID" ] || [ -z "$WEB_SERVICE_ID" ] || [ -z "$BALLOT_SERVICE_ID" ]; then
            echo "::error::RAILWAY_TOKEN, RAILWAY_API_SERVICE_ID, RAILWAY_WEB_SERVICE_ID and RAILWAY_BALLOT_SERVICE_ID must be set in the staging environment"
            exit 1
          fi
          # Checked before anything deploys, so a mistyped list stops the run
          # with staging untouched.
          read -ra seats <<<"${SEAT_SERVICE_IDS//,/ }"
          for seat in "${seats[@]}"; do
            [[ "$seat" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || {
              echo "::error::RAILWAY_SEAT_SERVICE_IDS holds something that isn't a Railway service ID"
              exit 1
            }
          done
          gql() {
            curl -sS --fail-with-body --retry 4 https://backboard.railway.com/graphql/v2 \
              -H "Project-Access-Token: $RAILWAY_TOKEN" -H 'content-type: application/json' \
              -d "$(jq -cn --arg q "$1" --argjson v "$2" '{query: $q, variables: $v}')" |
              jq -e 'if .errors then error(.errors | tostring) else .data end'
          }
          # A project token is scoped to one Railway environment.
          env_id="$(gql "$Q_ENV" '{}' | jq -er .projectToken.environmentId)"
          deploy() {
            local service_id="$1" image="$2" deployment status
            gql "$Q_SOURCE" "$(jq -cn --arg s "$service_id" --arg e "$env_id" --arg i "$image" '{s: $s, e: $e, i: $i}')" |
              jq -e '.serviceInstanceUpdate == true' >/dev/null
            deployment="$(gql "$Q_DEPLOY" "$(jq -cn --arg s "$service_id" --arg e "$env_id" '{s: $s, e: $e}')" | jq -er .serviceInstanceDeployV2)"
            echo "Railway deployment $deployment: $image" | tee -a "$GITHUB_STEP_SUMMARY"
            for _ in $(seq 120); do
              status="$(gql "$Q_STATUS" "$(jq -cn --arg d "$deployment" '{d: $d}')" | jq -er .deployment.status)"
              case "$status" in
                SUCCESS) echo "deployed $image"; return 0 ;;
                # NEEDS_APPROVAL and SLEEPING never become live on their own.
                FAILED | CRASHED | REMOVED | SKIPPED | NEEDS_APPROVAL | SLEEPING)
                  echo "::error::Railway deployment $deployment ended $status"
                  return 1
                  ;;
              esac
              sleep 10
            done
            echo "::error::Railway deployment $deployment not live after 20 minutes"
            return 1
          }
          deploy "$API_SERVICE_ID" "$API_IMAGE"
          deploy "$WEB_SERVICE_ID" "$WEB_IMAGE"
          deploy "$BALLOT_SERVICE_ID" "$BALLOT_IMAGE"
          # One image, three services: each worker's variables decide what it
          # runs (the posting worker's start command is `node posting.mjs`,
          # set on its Railway service), the creation worker holds the
          # creation key alone and the posting worker the posting key alone
          # (docs/runbooks/posting-relay.md).
          if [ -n "$SETUP_WORKER_SERVICE_ID" ]; then
            deploy "$SETUP_WORKER_SERVICE_ID" "$WORKER_IMAGE"
          else
            echo "::notice::RAILWAY_SETUP_WORKER_SERVICE_ID is not set; not deploying the setup worker"
          fi
          if [ -n "$CREATION_WORKER_SERVICE_ID" ]; then
            deploy "$CREATION_WORKER_SERVICE_ID" "$WORKER_IMAGE"
          else
            echo "::notice::RAILWAY_CREATION_WORKER_SERVICE_ID is not set; not deploying the creation worker"
          fi
          if [ -n "$POSTING_WORKER_SERVICE_ID" ]; then
            deploy "$POSTING_WORKER_SERVICE_ID" "$WORKER_IMAGE"
          else
            echo "::notice::RAILWAY_POSTING_WORKER_SERVICE_ID is not set; not deploying the posting worker"
          fi
          # One seat at a time, each live before the next, so a seat Railway
          # reports failed stops the release before the rest
          # (docs/runbooks/trustee-node.md, Staging on Railway).
          if [ "${#seats[@]}" = 0 ]; then
            echo "::notice::RAILWAY_SEAT_SERVICE_IDS is not set; not deploying the launch panel's seats"
          fi
          for seat in "${seats[@]}"; do deploy "$seat" "$SEAT_IMAGE"; done
