# Required check: `crypto-review`.
# Adversarial review, at the highest effort, of every change to
# packages/crypto, packages/circuits, packages/contracts, packages/verifier and
# docs/spec. Passes immediately when none of those paths change, so it can be a
# required check on every PR. Fails on any blocking finding and fails closed.
# Model: repository variable REVIEW_MODEL (falls back to the CLI's `opus` alias).
# Prompt: .github/review/crypto-review.md (changes need maintainer review).
name: crypto-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge group only contains PRs this check already passed on; the job is
  # skipped there (a skipped required check counts as passing) so a merge
  # queue never stalls on it. With a batch size above one, the combined tree
  # is never model-reviewed: configure any merge queue with batch size 1.
  merge_group:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: crypto-review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  crypto-review:
    name: crypto-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Refuse external pull requests
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::crypto-review only runs on branches of this repository (forks get no secrets). A maintainer must re-open the change from an in-repo branch."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Does this change touch protocol code?
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # -z and quotePath=false: git otherwise quotes non-ASCII paths
        # ("packages/crypto/\311\241roup.ts"), which would not match the pattern
        # and would silently skip this review. Fails closed if the diff is empty.
        run: |
          pattern='^(packages/(crypto|circuits|contracts|verifier)/|docs/spec/|\.github/scripts/install-toolchain\.sh$|pnpm-workspace\.yaml$)'
          git -c core.quotePath=false diff --name-only -z "$BASE_SHA...HEAD" >"$RUNNER_TEMP/changed.z"
          changed="$(tr '\0' '\n' <"$RUNNER_TEMP/changed.z")"
          if [ -z "$changed" ]; then
            echo "::error::could not determine the changed files; refusing to skip crypto-review"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -qE "$pattern"; then
            echo "applies=true" >>"$GITHUB_OUTPUT"
            printf '%s\n' "$changed" | grep -E "$pattern" | sed 's/^/- /' >>"$GITHUB_STEP_SUMMARY"
          else
            echo "applies=false" >>"$GITHUB_OUTPUT"
            echo "No changes under packages/{crypto,circuits,contracts,verifier}, docs/spec or the toolchain and catalog pins: not applicable." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Load review prompt
        id: prompt
        if: steps.scope.outputs.applies == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "text<<$delim"
            cat .github/review/crypto-review.md
            echo
            echo "## This run"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Pull request: #$PR_NUMBER"
            echo "- Base commit: $BASE_SHA"
            echo "- Head commit: $HEAD_SHA (checked out)"
            echo "- Diff: git diff $BASE_SHA...$HEAD_SHA"
            echo "$delim"
          } >>"$GITHUB_OUTPUT"
      - name: Review
        id: review
        if: steps.scope.outputs.applies == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590 # v1.0.230
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: claude
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ vars.REVIEW_MODEL || 'opus' }}
            --effort max
            --max-turns 400
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","summary","findings"],"properties":{"verdict":{"enum":["pass","fail"]},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["severity","title","file","line","detail"],"properties":{"severity":{"enum":["blocking","non-blocking"]},"title":{"type":"string"},"file":{"type":"string"},"line":{"type":"integer"},"threat":{"type":"string"},"detail":{"type":"string"}}}}}}'
      - name: Show why the review run failed
        if: always() && steps.review.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        # Prints only the final result message (an API or CLI error), never the
        # transcript: full output can contain tool results.
        run: |
          f="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          [ -f "$f" ] || { echo "no execution file"; exit 0; }
          jq -r '[.[] | select(.type == "result")] | last | "is_error=\(.is_error) subtype=\(.subtype)\n\(.result // "(no result text)")"' "$f" || echo "unexpected execution file format"
      - name: Verdict
        id: verdict
        if: steps.scope.outputs.applies == 'true'
        env:
          REVIEW_NAME: crypto-review
          REVIEW_JSON: ${{ steps.review.outputs.structured_output }}
          REVIEW_OUTCOME: ${{ steps.review.outputs.conclusion }}
          OUT_FILE: ${{ runner.temp }}/crypto-review.md
        run: python3 .github/scripts/review-verdict.py
      - name: Post review summary
        if: always() && steps.scope.outputs.applies == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/upsert-comment.sh "$PR_NUMBER" "$RUNNER_TEMP/crypto-review.md"
