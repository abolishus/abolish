packages:
  - apps/*
  - packages/*
  # CI gate code lives under .github/ so CODEOWNERS covers it: a PR cannot
  # weaken the policy that checks it without the owner's review.
  - .github/tools/*

# Supply chain (see AGENTS.md "Dependencies"): every version is exact and lives
# here once. Packages reference it with "catalog:".
catalogMode: strict
savePrefix: ""

# Refuse versions younger than 7 days (minutes); most malicious publishes are
# caught and yanked well inside that window.
minimumReleaseAge: 10080
# Refuse git/tarball/URL dependencies anywhere in the tree.
blockExoticSubdeps: true
# Refuse a version whose publish provenance is weaker than an earlier one.
trustPolicy: no-downgrade
# semver@6.3.1 is a July 2023 security backport published without provenance
# after 7.5.x had it, so no-downgrade flags it falsely. Storybook needs it via
# react-docgen -> @babel/core 7. Owner decision 2026-10-11 (P0-2).
trustPolicyExclude:
  - semver@6.3.1
# Install scripts run only for packages listed in allowBuilds.
strictDepBuilds: true
allowBuilds: {}
# msgpackr (via bullmq, P2-4) loads this optional native accelerator, a
# prebuilt binary, whenever it is installed. Left out, msgpackr uses its
# pure-JS codec, and no opaque native code runs beside the database
# credential. apps/worker's tests check it doesn't resolve.
ignoredOptionalDependencies:
  - msgpackr-extract

catalog:
  # Proving toolchain: must match NOIR_VERSION / BB_VERSION in
  # .github/scripts/install-toolchain.sh (AGENTS.md "Toolchain pins").
  "@aztec/bb.js": 5.0.0-nightly.20260522
  "@better-auth/passkey": 1.7.7
  "@changesets/cli": 3.0.3
  "@noble/curves": 2.4.0
  "@noble/hashes": 2.4.0
  "@noir-lang/noir_js": 1.0.0-beta.22
  "@orpc/contract": 1.15.4
  "@orpc/openapi": 1.15.4
  "@orpc/server": 1.15.4
  "@orpc/zod": 1.15.4
  "@storybook/addon-a11y": 10.6.1
  "@storybook/addon-vitest": 10.6.1
  "@storybook/react-vite": 10.6.1
  "@types/node": 24.19.1
  "@types/react": 19.2.7
  "@types/react-dom": 19.2.3
  "@vitest/browser-playwright": 5.0.1
  better-auth: 1.7.7
  bullmq: 6.3.11
  drizzle-orm: 0.45.3
  fast-check: 4.10.2
  ioredis: 5.11.1
  playwright: 1.63.0
  postgres: 3.4.9
  react: 19.3.0
  react-dom: 19.3.0
  storybook: 10.6.1
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
  yaml: 2.9.1
  zod: 4.6.5

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
