# Required check: `claude-review`.
# General correctness and threat-model review of every pull request. Fails on
# any blocking finding, and fails closed if the review cannot complete.
# Model: repository variable REVIEW_MODEL (falls back to the CLI's `opus` alias).
# Prompt: .github/review/claude-review.md (changes need maintainer review).
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge group only contains PRs this check already passed on; the job is
  # skipped there (a skipped required check counts as passing) so a merge
  # queue never stalls on it. With a batch size above one, the combined tree
  # is never model-reviewed: configure any merge queue with batch size 1.
  merge_group:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: claude-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Required checks are evaluated against the head SHA only. Retargeting a
      # PR's base doesn't re-run them, so checks that passed against another
      # base (e.g. a stacked branch that hides the real diff) must never count:
      # a PR to any branch but the default fails here and stays failed.
      - name: Pull request targets the default branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::required checks only pass for pull requests into $DEFAULT_BRANCH (this one targets $BASE_REF); stacked PRs are not supported"
            exit 1
          fi
      - name: Refuse external pull requests
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::claude-review only runs on branches of this repository (forks get no secrets). A maintainer must re-open the change from an in-repo branch."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load review prompt
        id: prompt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "text<<$delim"
            # The prompt comes from the base commit, so a PR can't rewrite its own
            # review instructions. Only the bootstrap PR, which adds it, uses head.
            if git cat-file -e "$BASE_SHA:.github/review/claude-review.md" 2>/dev/null; then
              git show "$BASE_SHA:.github/review/claude-review.md"
            else
              echo "::warning::.github/review/claude-review.md is not on the base branch; using the PR's copy" >&2
              cat .github/review/claude-review.md
            fi
            echo
            echo "## This run"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Pull request: #$PR_NUMBER"
            echo "- Base commit: $BASE_SHA"
            echo "- Head commit: $HEAD_SHA (checked out)"
            echo "- Diff: git diff $BASE_SHA...$HEAD_SHA"
            echo "$delim"
          } >>"$GITHUB_OUTPUT"
      - name: Review
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590 # v1.0.230
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: claude
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ vars.REVIEW_MODEL || 'opus' }}
            --effort high
            --max-turns 120
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","summary","findings"],"properties":{"verdict":{"enum":["pass","fail"]},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["severity","title","file","line","detail"],"properties":{"severity":{"enum":["blocking","non-blocking"]},"title":{"type":"string"},"file":{"type":"string"},"line":{"type":"integer"},"threat":{"type":"string"},"detail":{"type":"string"}}}}}}'
      - name: Show why the review run failed
        if: always() && steps.review.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        # Prints only the final result message (an API or CLI error), never the
        # transcript: full output can contain tool results.
        run: |
          f="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          [ -f "$f" ] || { echo "no execution file"; exit 0; }
          jq -r '[.[] | select(.type == "result")] | last | "is_error=\(.is_error) subtype=\(.subtype)\n\(.result // "(no result text)")"' "$f" || echo "unexpected execution file format"
      - name: Verdict
        id: verdict
        env:
          REVIEW_NAME: claude-review
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_JSON: ${{ steps.review.outputs.structured_output }}
          REVIEW_OUTCOME: ${{ steps.review.outputs.conclusion }}
          OUT_FILE: ${{ runner.temp }}/claude-review.md
        # Verdict logic also comes from the base commit when it exists there.
        run: |
          if git cat-file -e "$BASE_SHA:.github/scripts/review-verdict.py" 2>/dev/null; then
            git show "$BASE_SHA:.github/scripts/review-verdict.py" >"$RUNNER_TEMP/review-verdict.py"
          else
            cp .github/scripts/review-verdict.py "$RUNNER_TEMP/review-verdict.py"
          fi
          python3 "$RUNNER_TEMP/review-verdict.py"
      - name: Post review summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/upsert-comment.sh "$PR_NUMBER" "$RUNNER_TEMP/claude-review.md"
