# Publishes `next` prereleases of the published packages (@abolishus/crypto,
# verifier, sdk) on every push to main. Threats: T-61 (release or publishing
# compromise), T-57 (insider change), T-56 (compromised action or runner),
# T-55 (hijacked dependency).
#
# Trust layout: code that isn't gated (Changesets configured from `.changeset/`;
# any one package's build) never shares a checkout or runner with the gate code
# that judges the release, or with another package's tarball.
#
#   version  runs `changeset version --snapshot next` and reports the
#            versions it proposes. Untrusted output; checkout discarded.
#   plan     gate code only, fresh checkout, no build: `release-apply`
#            accepts only `next` snapshots of this commit for the published
#            packages. Its plan travels as job outputs, which no other job
#            can write.
#   build    one job per package and variant (two variants: different paths,
#            locale, timezone, umask), each in a fresh checkout producing
#            exactly one tarball (`vp pack` + `pnpm pack`); no secrets, no OIDC
#   verify   gate code only, fresh checkout, no build: exactly one tarball per
#            planned package from each variant, byte-identical across both,
#            and each packed manifest and file list acceptable to publish
#   checks   waits for `ci`, `repro-build` and `reference-election` on this
#            commit and requires each to have passed: two PRs reviewed apart
#            can merge into a combination no check saw (STATUS known-weak)
#   sign     cosign keyless signature (Sigstore bundle) per tarball, plus SLSA
#            build provenance (GitHub attestations); OIDC, no publish rights
#   publish  `npm publish --tag next` of exactly the verified, signed tarballs,
#            via npm trusted publishing (OIDC) in the `npm` environment; npm
#            adds its own provenance. No npm token exists anywhere.
#
# Snapshot versions are `<x.y.z>-next-<commit>` (.changeset/config.json), so a
# build is a pure function of the commit. Without a pending changeset there is
# nothing to publish and the run ends after plan. `latest` is never set here:
# the owner promotes releases. Ballot-client, OpenAPI and container image
# releases join this workflow when apps/ballot (P2-8), api-contract (P2-2) and
# the deploy pipeline (P2-11) exist.
name: release

on:
  push:
    branches: [main]

permissions: {}

# Never cancel a release mid-publish. GitHub keeps one pending run per group,
# so of several pushes queued behind a running release only the newest
# publishes; snapshots are per commit, so nothing is lost but intermediate
# snapshots. Re-running an older run after a newer one has published moves
# `next` back to the older commit: don't.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DO_NOT_TRACK: "1"

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not .github/actions/setup: that saves a dependency cache, which code
      # run by Changesets could poison for later CI jobs.
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          run-install: "false"
      - name: Install dependencies (frozen lockfile)
        run: vp install --frozen-lockfile --ignore-scripts -- --ignore-pnpmfile
      - name: Version next snapshots
        run: vp exec changeset version --snapshot next
      # Anything above may have rewritten this checkout, including the gate
      # code that prints this list; the build jobs judge it, not this job.
      - name: Report proposed versions
        run: vp node .github/tools/ci/src/cli.ts release-versions >"$RUNNER_TEMP/versions.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: versions
          path: ${{ runner.temp }}/versions.txt
          if-no-files-found: error

  plan:
    name: plan
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      plan: ${{ steps.plan.outputs.plan }}
      versions: ${{ steps.plan.outputs.versions }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          run-install: "false"
      - name: Install dependencies (frozen lockfile, no install scripts)
        run: vp install --frozen-lockfile --ignore-scripts -- --ignore-pnpmfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: versions
          path: ${{ runner.temp }}/proposed
      - name: Accept next snapshot versions
        id: plan
        run: |
          plan="$(vp node .github/tools/ci/src/cli.ts release-apply --versions "$RUNNER_TEMP/proposed/versions.txt")"
          {
            echo "plan<<PLAN_EOF"
            [ -z "$plan" ] || printf '%s\n' "$plan"
            echo "PLAN_EOF"
            echo "versions<<PLAN_EOF"
            [ -z "$plan" ] || printf '%s\n' "$plan" | awk '{ print $1, $3 }'
            echo "PLAN_EOF"
            printf 'packages=%s\n' "$(printf '%s' "$plan" | jq -R -s -c 'split("\n") | map(select(. != "") | split(" ") | {name: .[1], dir: .[0]})')"
            if [ -n "$plan" ]; then echo "publish=true"; else echo "publish=false"; fi
          } >>"$GITHUB_OUTPUT"
          if [ -z "$plan" ]; then echo "nothing to publish (no pending changesets)" | tee -a "$GITHUB_STEP_SUMMARY"; fi

  build:
    name: build ${{ matrix.package.name }} (${{ matrix.variant }})
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
        variant: [a, b]
    env:
      CHECKOUT: ${{ matrix.variant == 'a' && 'abolish' || 'some/other/dir/abolish-release' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.CHECKOUT }}
          persist-credentials: false
      - name: Pin SOURCE_DATE_EPOCH to the commit time
        working-directory: ${{ env.CHECKOUT }}
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      # Same steps as .github/actions/setup, inlined: `uses:` cannot take a matrix path.
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          working-directory: ${{ env.CHECKOUT }}
          run-install: "false"
      - name: Install dependencies (frozen lockfile)
        working-directory: ${{ env.CHECKOUT }}
        run: vp install --frozen-lockfile --ignore-scripts -- --ignore-pnpmfile
      # Gate code runs before any build code in this job, and verify re-judges
      # everything this job produces, so nothing here is trusted afterwards.
      - name: Build and pack
        working-directory: ${{ env.CHECKOUT }}
        env:
          VERSIONS: ${{ needs.plan.outputs.versions }}
          NAME: ${{ matrix.package.name }}
          DIR: ${{ matrix.package.dir }}
          TZ: ${{ matrix.variant == 'a' && 'UTC' || 'Pacific/Auckland' }}
          LANG: ${{ matrix.variant == 'a' && 'C.UTF-8' || 'en_US.UTF-8' }}
          LC_ALL: ${{ matrix.variant == 'a' && 'C.UTF-8' || 'en_US.UTF-8' }}
          UMASK: ${{ matrix.variant == 'a' && '0022' || '0077' }}
          OUT: ${{ runner.temp }}/out
        run: |
          umask "$UMASK"
          printf '%s\n' "$VERSIONS" >"$RUNNER_TEMP/versions.txt"
          vp node .github/tools/ci/src/cli.ts release-apply --versions "$RUNNER_TEMP/versions.txt" >/dev/null
          vp run --no-cache --filter "$NAME..." build
          mkdir -p "$OUT"
          (cd "$DIR" && vp pm pack --pack-destination "$OUT")
      - name: Artifact name
        id: artifact
        env:
          NAME: ${{ matrix.package.name }}
          VARIANT: ${{ matrix.variant }}
        run: echo "name=tgz-$VARIANT-$(printf '%s' "${NAME#@}" | tr / -)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

  verify:
    name: verify
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          run-install: "false"
      - name: Install dependencies (frozen lockfile, no install scripts)
        run: vp install --frozen-lockfile --ignore-scripts -- --ignore-pnpmfile
      # Code in any job of this run can upload artifacts with the run's token,
      # so tarballs are fetched by exact name, one artifact per planned package
      # and variant, and any other `tgz-*` artifact in the run fails the
      # release. (A pattern download would let a same-named file from a rogue
      # artifact silently replace a genuine one.) A rogue artifact that takes a
      # genuine name first only makes that build's upload fail: the run stops.
      - name: Fetch exactly the planned tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          expected="$(printf '%s\n' "$PLAN" | while read -r _dir name _version; do
            slug="$(printf '%s' "${name#@}" | tr / -)"
            printf 'tgz-a-%s\ntgz-b-%s\n' "$slug" "$slug"
          done | LC_ALL=C sort)"
          actual="$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[].name | select(startswith("tgz-"))' | LC_ALL=C sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::tarball artifacts in this run differ from the plan"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          # Not a pipeline: `exit` inside a piped loop only leaves its subshell.
          while read -r _dir name version; do
            slug="$(printf '%s' "${name#@}" | tr / -)"
            for v in a b; do
              d="$RUNNER_TEMP/artifacts/$v-$slug"
              gh run download "$RUN_ID" -R "$REPO" -n "tgz-$v-$slug" -D "$d" </dev/null
              if [ "$(ls -A "$d")" != "$slug-$version.tgz" ]; then
                echo "::error::artifact tgz-$v-$slug must hold exactly $slug-$version.tgz"
                exit 1
              fi
              mkdir -p "$RUNNER_TEMP/$v"
              mv "$d/$slug-$version.tgz" "$RUNNER_TEMP/$v/"
            done
          done <<<"$PLAN"
      - name: Tarballs match the plan, reproduce, and are fit to publish
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          RELEASE: ${{ runner.temp }}/release
        run: |
          mkdir -p "$RELEASE"
          printf '%s\n' "$PLAN" >"$RELEASE/plan.txt"
          vp node .github/tools/ci/src/cli.ts release-verify --plan "$RELEASE/plan.txt" --a "$RUNNER_TEMP/a" --b "$RUNNER_TEMP/b"
          cp "$RUNNER_TEMP"/a/*.tgz "$RELEASE/"
          cd "$RELEASE"
          find . -maxdepth 1 -type f -printf '%f\0' | LC_ALL=C sort -z | xargs -0 sha256sum >"$RUNNER_TEMP/manifest.txt"
          mv "$RUNNER_TEMP/manifest.txt" manifest.txt
          cat manifest.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-unsigned
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  checks:
    name: checks
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      checks: read
    steps:
      # Only check runs created by GitHub Actions (app 15368) count. On a
      # commit of main, only workflows triggered by the push to main run.
      - name: ci, repro-build and reference-election passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 160); do
            pending=0
            for check in ci repro-build reference-election; do
              # Retried: one failed API call shouldn't fail a release.
              for attempt in 1 2 3; do
                if run="$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=$check&filter=latest" \
                  --jq '[.check_runs[] | select(.app.id == 15368)] | max_by(.id) // {} | "\(.status // "missing") \(.conclusion // "")"')"; then
                  break
                fi
                [ "$attempt" = 3 ] && exit 1
                sleep 10
              done
              case "$run" in
                "completed success") ;;
                "completed "*)
                  echo "::error::$check concluded ${run#completed } on $SHA; not publishing"
                  exit 1
                  ;;
                *) pending=1 ;;
              esac
            done
            if [ "$pending" = 0 ]; then
              echo "ci, repro-build and reference-election passed on $SHA"
              exit 0
            fi
            sleep 30
          done
          echo "::error::checks still pending on $SHA after 80 minutes"
          exit 1

  sign:
    name: sign
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-unsigned
          path: release
      - name: Tarballs match the verified manifest
        working-directory: release
        run: sha256sum --strict -c manifest.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Cosign keyless signatures
        working-directory: release
        run: |
          for f in *.tgz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed
          path: release/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish
    needs: sign
    # Documents intent only: a branch that edits this file can drop the
    # condition. What actually stops a branch from publishing is the `npm`
    # environment allowing deployments from `main` only (owner setting, T-61).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Trusted publishing on npm is bound to this workflow file and environment.
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      NPM_VERSION: 11.21.0
      NPM_INTEGRITY: sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only the root files (always in a cone-mode sparse checkout) are
          # needed: pnpm-workspace.yaml and .node-version for setup-vp.
          sparse-checkout: .github/scripts
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          run-install: "false"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signed
          path: ${{ runner.temp }}/release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Tarballs are the verified, signed ones
        working-directory: ${{ runner.temp }}/release
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          sha256sum --strict -c manifest.txt
          for f in *.tgz; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
      # Trusted publishing needs npm >= 11.5, newer than the one bundled with
      # Node. Fetched from the registry by exact version and integrity rather
      # than `npm install -g`, which would run npm's own resolution.
      - name: Install the pinned npm CLI
        run: |
          tgz="$RUNNER_TEMP/npm-$NPM_VERSION.tgz"
          curl -sSfL --retry 4 -o "$tgz" "https://registry.npmjs.org/npm/-/npm-$NPM_VERSION.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
          if [ "$actual" != "$NPM_INTEGRITY" ]; then
            echo "::error::npm $NPM_VERSION integrity mismatch: $actual"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/npm"
          tar xzf "$tgz" -C "$RUNNER_TEMP/npm" --strip-components=1
          echo "NPM_CLI=$RUNNER_TEMP/npm/bin/npm-cli.js" >>"$GITHUB_ENV"
      # The one place npm is called directly (AGENTS.md). Always `--tag next`;
      # never `latest`. A version already on the registry (a re-run) is skipped.
      # The plan is read on fd 3 so no command in the loop can consume it.
      - name: npm publish --tag next
        working-directory: ${{ runner.temp }}/release
        run: |
          vp node "$NPM_CLI" --version
          while read -r _dir name version <&3; do
            f="$(printf '%s' "${name#@}" | tr / -)-$version.tgz"
            if [ "$(vp node "$NPM_CLI" view "$name@$version" version </dev/null 2>/dev/null || true)" = "$version" ]; then
              echo "$name@$version is already published"
              continue
            fi
            vp node "$NPM_CLI" publish "./$f" --tag next --access public --provenance --ignore-scripts </dev/null
            echo "- \`$name@$version\` published as \`next\`" >>"$GITHUB_STEP_SUMMARY"
            # Tripwire: the owner alone promotes `latest`. Fails the run (and
            # so alerts) if this publish moved it anyway.
            latest="$(vp node "$NPM_CLI" view "$name" dist-tags.latest </dev/null)"
            if [ "$latest" = "$version" ]; then
              echo "::error::$name@$version became latest; the owner must restore the previous latest"
              exit 1
            fi
          done 3<plan.txt
