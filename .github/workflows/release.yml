# Publishes `next` prereleases of the published packages (@abolishus/crypto,
# verifier, sdk) on every push to main. Threats: T-61 (release or publishing
# compromise), T-56 (compromised action or runner), T-55 (hijacked dependency).
#
#   version  runs `changeset version --snapshot next` and reports the
#            versions it proposes. Changesets is third-party code configured
#            from the ungated `.changeset/`, so this job's output is untrusted
#            data and its checkout is discarded.
#   build    two independent builds (different paths, locale, timezone, umask)
#            in fresh checkouts that never run Changesets: `release-apply`
#            (CODEOWNERS-protected) accepts only `next` snapshots of this
#            commit for the published packages and rewrites only their
#            `version` fields, then `vp pack` + `pnpm pack`; no secrets, no OIDC
#   compare  the two tarball manifests must be byte-identical
#   checks   waits for `ci`, `repro-build` and `reference-election` on this
#            commit and requires each to have passed: two PRs reviewed apart
#            can merge into a combination no check saw (STATUS known-weak)
#   sign     cosign keyless signature (Sigstore bundle) per tarball, plus SLSA
#            build provenance (GitHub attestations); OIDC, no publish rights
#   publish  `npm publish --tag next` of exactly the compared, signed tarballs,
#            via npm trusted publishing (OIDC) in the `npm` environment; npm
#            adds its own provenance. No npm token exists anywhere.
#
# Snapshot versions are `<x.y.z>-next-<commit>` (.changeset/config.json), so a
# build is a pure function of the commit. Without a pending changeset there is
# nothing to publish and the run ends after compare. `latest` is never set
# here: the owner promotes releases. Ballot-client, OpenAPI and container
# image releases join this workflow when apps/ballot (P2-8), api-contract
# (P2-2) and the deploy pipeline (P2-11) exist.
name: release

on:
  push:
    branches: [main]

permissions: {}

# Never cancel a release mid-publish. GitHub keeps one pending run per group,
# so of several pushes queued behind a running release only the newest
# publishes; snapshots are per commit, so nothing is lost but intermediate
# snapshots. Re-running an older run after a newer one has published moves
# `next` back to the older commit: don't.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DO_NOT_TRACK: "1"

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not .github/actions/setup: that saves a dependency cache, which code
      # run by Changesets could poison for later CI jobs.
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          run-install: "false"
      - name: Install dependencies (frozen lockfile)
        run: vp install --frozen-lockfile --ignore-scripts -- --ignore-pnpmfile
      - name: Version next snapshots
        run: vp exec changeset version --snapshot next
      # Anything above may have rewritten this checkout, including the gate
      # code that prints this list; the build jobs judge it, not this job.
      - name: Report proposed versions
        run: vp node .github/tools/ci/src/cli.ts release-versions >"$RUNNER_TEMP/versions.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: versions
          path: ${{ runner.temp }}/versions.txt
          if-no-files-found: error

  build:
    name: build (${{ matrix.variant }})
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: a
            path: abolish
            tz: UTC
            lang: C.UTF-8
            umask: "0022"
          - variant: b
            path: some/other/dir/abolish-release
            tz: Pacific/Auckland
            lang: en_US.UTF-8
            umask: "0077"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ matrix.path }}
          persist-credentials: false
      - name: Pin SOURCE_DATE_EPOCH to the commit time
        working-directory: ${{ matrix.path }}
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      # Same steps as .github/actions/setup, inlined: `uses:` cannot take a matrix path.
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          working-directory: ${{ matrix.path }}
          run-install: "false"
      - name: Install dependencies (frozen lockfile)
        working-directory: ${{ matrix.path }}
        run: vp install --frozen-lockfile --ignore-scripts -- --ignore-pnpmfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: versions
          path: ${{ runner.temp }}/proposed
      - name: Build and pack
        working-directory: ${{ matrix.path }}
        env:
          TZ: ${{ matrix.tz }}
          LANG: ${{ matrix.lang }}
          LC_ALL: ${{ matrix.lang }}
          OUT: ${{ runner.temp }}/release
        run: |
          umask ${{ matrix.umask }}
          mkdir -p "$OUT"
          vp node .github/tools/ci/src/cli.ts release-apply --versions "$RUNNER_TEMP/proposed/versions.txt" >"$OUT/plan.txt"
          # The plan is read on fd 3 so no command in the loop can consume it.
          while read -r dir name version <&3; do
            echo "::group::$name@$version"
            vp run --no-cache --filter "$name" build </dev/null
            (cd "$dir" && vp pm pack --pack-destination "$OUT" </dev/null)
            # Judge what npm will publish, not the workspace manifest.
            tgz="$OUT/$(printf '%s' "${name#@}" | tr / -)-$version.tgz"
            tar -xzOf "$tgz" package/package.json |
              vp node .github/tools/ci/src/cli.ts release-shipped --name "$name" --version "$version"
            echo "::endgroup::"
          done 3<"$OUT/plan.txt"
          cd "$OUT"
          # Exactly one tarball per plan line and nothing else, so publish can
          # neither skip a planned package nor ship an unplanned file.
          expected="$(while read -r _dir name version; do printf '%s-%s.tgz\n' "$(printf '%s' "${name#@}" | tr / -)" "$version"; done <plan.txt | LC_ALL=C sort)"
          actual="$(find . -maxdepth 1 -type f ! -name plan.txt -printf '%f\n' | LC_ALL=C sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::packed files differ from the plan"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          # Every `exports` target must be in the tarball, or a signed release
          # ships a package that doesn't resolve.
          for f in *.tgz; do
            python3 - "$f" <<'PY'
          import json, sys, tarfile

          with tarfile.open(sys.argv[1]) as t:
              names = set(t.getnames())
              pkg = json.load(t.extractfile("package/package.json"))

          def targets(x):
              if isinstance(x, str):
                  yield x
              elif isinstance(x, dict):
                  for v in x.values():
                      yield from targets(v)

          missing = [p for p in targets(pkg.get("exports", {})) if "package/" + p.removeprefix("./") not in names]
          if missing:
              print(f"::error::{sys.argv[1]}: exports targets missing from the tarball: {missing}")
              sys.exit(1)
          PY
          done
          # The plan is hashed too, so both builds must agree on what ships.
          find . -maxdepth 1 -type f -printf '%f\0' | LC_ALL=C sort -z | xargs -0 -r sha256sum >"$RUNNER_TEMP/manifest-${{ matrix.variant }}.txt"
          cat "$RUNNER_TEMP/manifest-${{ matrix.variant }}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest-${{ matrix.variant }}
          path: ${{ runner.temp }}/manifest-${{ matrix.variant }}.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.variant == 'a'
        with:
          name: release-unsigned
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  compare:
    name: compare
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      publish: ${{ steps.compare.outputs.publish }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: manifest-*
          merge-multiple: true
      - name: Tarballs are byte-identical across both builds
        id: compare
        run: |
          if ! diff -u manifest-a.txt manifest-b.txt; then
            echo "::error::release tarballs differ between builds; the release is not reproducible"
            exit 1
          fi
          if grep -q '\.tgz$' manifest-a.txt; then
            echo "publish=true" >>"$GITHUB_OUTPUT"
          else
            echo "nothing to publish (no pending changesets)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >>"$GITHUB_OUTPUT"
          fi

  checks:
    name: checks
    needs: compare
    if: needs.compare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      checks: read
    steps:
      # Only check runs created by GitHub Actions (app 15368) count. On a
      # commit of main, only workflows triggered by the push to main run.
      - name: ci, repro-build and reference-election passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 160); do
            pending=0
            for check in ci repro-build reference-election; do
              run="$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=$check&filter=latest" \
                --jq '[.check_runs[] | select(.app.id == 15368)] | max_by(.id) // {} | "\(.status // "missing") \(.conclusion // "")"')"
              case "$run" in
                "completed success") ;;
                "completed "*)
                  echo "::error::$check concluded ${run#completed } on $SHA; not publishing"
                  exit 1
                  ;;
                *) pending=1 ;;
              esac
            done
            if [ "$pending" = 0 ]; then
              echo "ci, repro-build and reference-election passed on $SHA"
              exit 0
            fi
            sleep 30
          done
          echo "::error::checks still pending on $SHA after 80 minutes"
          exit 1

  sign:
    name: sign
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-unsigned
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manifest-b
      # Sign what build b reproduced, not just what build a uploaded.
      - name: Tarballs match the reproduced manifest
        working-directory: release
        run: sha256sum --strict -c ../manifest-b.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Cosign keyless signatures
        working-directory: release
        run: |
          for f in *.tgz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed
          path: release/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish
    needs: sign
    # Documents intent only: a branch that edits this file can drop the
    # condition. What actually stops a branch from publishing is the `npm`
    # environment allowing deployments from `main` only (owner setting, T-61).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Trusted publishing on npm is bound to this workflow file and environment.
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      NPM_VERSION: 11.21.0
      NPM_INTEGRITY: sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only the root files (always in a cone-mode sparse checkout) are
          # needed: pnpm-workspace.yaml and .node-version for setup-vp.
          sparse-checkout: .github/scripts
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: pnpm-workspace.yaml
          node-version-file: .node-version
          run-install: "false"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signed
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manifest-b
          path: ${{ runner.temp }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Tarballs are the reproduced, signed ones
        working-directory: ${{ runner.temp }}/release
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          sha256sum --strict -c ../manifest-b.txt
          for f in *.tgz; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
      # Trusted publishing needs npm >= 11.5, newer than the one bundled with
      # Node. Fetched from the registry by exact version and integrity rather
      # than `npm install -g`, which would run npm's own resolution.
      - name: Install the pinned npm CLI
        run: |
          tgz="$RUNNER_TEMP/npm-$NPM_VERSION.tgz"
          curl -sSfL --retry 4 -o "$tgz" "https://registry.npmjs.org/npm/-/npm-$NPM_VERSION.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
          if [ "$actual" != "$NPM_INTEGRITY" ]; then
            echo "::error::npm $NPM_VERSION integrity mismatch: $actual"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/npm"
          tar xzf "$tgz" -C "$RUNNER_TEMP/npm" --strip-components=1
          echo "NPM_CLI=$RUNNER_TEMP/npm/bin/npm-cli.js" >>"$GITHUB_ENV"
      # The one place npm is called directly (AGENTS.md). Always `--tag next`;
      # never `latest`. A version already on the registry (a re-run) is skipped.
      # The plan is read on fd 3 so no command in the loop can consume it.
      - name: npm publish --tag next
        working-directory: ${{ runner.temp }}/release
        run: |
          vp node "$NPM_CLI" --version
          while read -r _dir name version <&3; do
            f="$(printf '%s' "${name#@}" | tr / -)-$version.tgz"
            if [ "$(vp node "$NPM_CLI" view "$name@$version" version </dev/null 2>/dev/null || true)" = "$version" ]; then
              echo "$name@$version is already published"
              continue
            fi
            vp node "$NPM_CLI" publish "./$f" --tag next --access public --provenance --ignore-scripts </dev/null
            echo "- \`$name@$version\` published as \`next\`" >>"$GITHUB_STEP_SUMMARY"
            # Tripwire: the owner alone promotes `latest`. Fails the run (and
            # so alerts) if this publish moved it anyway.
            latest="$(vp node "$NPM_CLI" view "$name" dist-tags.latest </dev/null)"
            if [ "$latest" = "$version" ]; then
              echo "::error::$name@$version became latest; the owner must restore the previous latest"
              exit 1
            fi
          done 3<plan.txt
