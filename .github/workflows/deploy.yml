# Builds, signs and deploys the API image to staging on every push to main
# (P2-11; docs/runbooks/railway.md). Threats: T-61 (release compromise), T-65
# (deployer credential leak), T-56 (compromised action or runner), T-23.
#
#   image-a/b  one fresh checkout each, different path, locale, timezone and
#              umask; build the bundle and the image (.github/actions/
#              image-build); output the image manifest digest. No secrets.
#   checks     ci, repro-build and reference-election passed on this commit.
#   publish    both digests match; the archive is that image; push it to
#              GHCR by digest, sign it (cosign keyless) and attest SLSA build
#              provenance. No Railway token.
#   staging    in the `staging` environment (main only): verify signature and
#              provenance, run the image's migrations, then point the Railway
#              `api` service at the digest and wait for the deployment.
#
# Production is not here yet: its deploy needs the reference election to have
# passed against staging for the digest (P1-20), so until then no job can
# deploy to production at all. Railway never builds: it pulls the digest.
name: deploy

on:
  push:
    branches: [main]

permissions: {}

# One staging deploy at a time, in push order; a newer push supersedes a
# queued one, never a running one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  DO_NOT_TRACK: "1"
  IMAGE: ghcr.io/${{ github.repository_owner }}/abolish-api

jobs:
  image-a:
    name: image api (a)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: build
        uses: ./.github/actions/image-build
        with:
          service: api
          variant: a

  image-b:
    name: image api (b)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: build
        uses: ./.github/actions/image-build
        with:
          service: api
          variant: b

  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      checks: read
    steps:
      # As in release.yml: only check runs created by GitHub Actions (app
      # 15368) count, and on a commit of main only push-triggered runs exist.
      - name: ci, repro-build and reference-election passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 160); do
            pending=0
            for check in ci repro-build reference-election; do
              for attempt in 1 2 3; do
                if run="$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=$check&filter=latest" \
                  --jq '[.check_runs[] | select(.app.id == 15368)] | max_by(.id) // {} | "\(.status // "missing") \(.conclusion // "")"')"; then
                  break
                fi
                [ "$attempt" = 3 ] && exit 1
                sleep 10
              done
              case "$run" in
                "completed success") ;;
                "completed "*)
                  echo "::error::$check concluded ${run#completed } on $SHA; not deploying"
                  exit 1
                  ;;
                *) pending=1 ;;
              esac
            done
            if [ "$pending" = 0 ]; then
              echo "ci, repro-build and reference-election passed on $SHA"
              exit 0
            fi
            sleep 30
          done
          echo "::error::checks still pending on $SHA after 80 minutes"
          exit 1

  publish:
    name: publish
    needs: [image-a, image-b, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ needs.image-a.outputs.digest }}
    steps:
      - name: Both builds produced one image
        env:
          A: ${{ needs.image-a.outputs.digest }}
          B: ${{ needs.image-b.outputs.digest }}
        run: |
          if [ "$A" != "$B" ]; then
            echo "::error::image digests differ between builds ($A, $B); the image is not reproducible"
            exit 1
          fi
          echo "image digest: $A" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-a-api
          path: ${{ runner.temp }}/image
      # The artifact can be replaced by anything else in the run; the digest
      # is a job output, which can't. Only the image it names is pushed.
      - name: The archive is that image
        env:
          DIGEST: ${{ needs.image-a.outputs.digest }}
        run: |
          actual="sha256:$(skopeo inspect --raw "oci-archive:$RUNNER_TEMP/image/api.tar" | sha256sum | cut -d' ' -f1)"
          if [ "$actual" != "$DIGEST" ]; then
            echo "::error::archive holds $actual, built $DIGEST"
            exit 1
          fi
      - name: Push by digest
        env:
          DIGEST: ${{ needs.image-a.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          # skopeo and cosign both read the Docker credentials this writes.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          # --preserve-digests: fail rather than push a recompressed image
          # under another digest. The tag is for people; deploys use digests.
          skopeo copy --preserve-digests "oci-archive:$RUNNER_TEMP/image/api.tar" "docker://$IMAGE:sha-$SHA"
          pushed="$(skopeo inspect --raw "docker://$IMAGE@$DIGEST" | sha256sum | cut -d' ' -f1)"
          [ "sha256:$pushed" = "$DIGEST" ]
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Cosign keyless signature
        env:
          DIGEST: ${{ needs.image-a.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image-a.outputs.digest }}
          push-to-registry: true

  staging:
    name: staging
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Secrets live only in this environment, which allows `main` alone
    # (owner setting): a workflow run for a PR branch can't read them (T-65).
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      # Before anything reads the image: the package may still be private.
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      # Signed by this workflow on main, with provenance from this repository:
      # the digest deployed is the one publish built twice and compared.
      - name: Verify signature and provenance
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
          REPO: ${{ github.repository }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/deploy.yml" --source-ref refs/heads/main
      # The image's own migrate.mjs, as a login granted abolish_migrator
      # that the API service never holds (docs/runbooks/railway.md).
      - name: Migrate
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::MIGRATE_DATABASE_URL is not set in the staging environment"; exit 1; }
          docker run --rm -e DATABASE_URL "$IMAGE@$DIGEST" node migrate.mjs
      - name: Deploy the API to Railway
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
          # Railway's GraphQL API (backboard.railway.com/graphql/v2).
          Q_ENV: "query { projectToken { environmentId } }"
          Q_SOURCE: >-
            mutation($s: String!, $e: String!, $i: String!) {
            serviceInstanceUpdate(serviceId: $s, environmentId: $e, input: { source: { image: $i } }) }
          Q_DEPLOY: "mutation($s: String!, $e: String!) { serviceInstanceDeployV2(serviceId: $s, environmentId: $e) }"
          Q_STATUS: "query($d: String!) { deployment(id: $d) { status } }"
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$SERVICE_ID" ]; then
            echo "::error::RAILWAY_TOKEN and RAILWAY_API_SERVICE_ID must be set in the staging environment"
            exit 1
          fi
          gql() {
            curl -sS --fail-with-body --retry 4 https://backboard.railway.com/graphql/v2 \
              -H "Project-Access-Token: $RAILWAY_TOKEN" -H 'content-type: application/json' \
              -d "$(jq -cn --arg q "$1" --argjson v "$2" '{query: $q, variables: $v}')" |
              jq -e 'if .errors then error(.errors | tostring) else .data end'
          }
          # A project token is scoped to one Railway environment.
          env_id="$(gql "$Q_ENV" '{}' | jq -er .projectToken.environmentId)"
          gql "$Q_SOURCE" "$(jq -cn --arg s "$SERVICE_ID" --arg e "$env_id" --arg i "$IMAGE@$DIGEST" '{s: $s, e: $e, i: $i}')" |
            jq -e '.serviceInstanceUpdate == true' >/dev/null
          deployment="$(gql "$Q_DEPLOY" "$(jq -cn --arg s "$SERVICE_ID" --arg e "$env_id" '{s: $s, e: $e}')" | jq -er .serviceInstanceDeployV2)"
          echo "Railway deployment $deployment: $IMAGE@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
          for _ in $(seq 120); do
            status="$(gql "$Q_STATUS" "$(jq -cn --arg d "$deployment" '{d: $d}')" | jq -er .deployment.status)"
            case "$status" in
              SUCCESS) echo "deployed"; exit 0 ;;
              # NEEDS_APPROVAL and SLEEPING never become live on their own.
              FAILED | CRASHED | REMOVED | SKIPPED | NEEDS_APPROVAL | SLEEPING)
                echo "::error::Railway deployment $deployment ended $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Railway deployment $deployment not live after 20 minutes"
          exit 1
